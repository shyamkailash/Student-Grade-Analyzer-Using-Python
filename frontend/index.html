
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Welcome Page -->
        <div class="welcome-card" id="welcomePage">
            <div class="icon">🎓</div>
            <h1>Student Grade Analyzer</h1>
            <p>Calculate your academic performance and view your results instantly.</p>
            <button onclick="startAnalyzer()">Get Started →</button>
            <p class="footer-text">Simple • Fast • Accurate</p>
        </div>

        <!-- Marks Entry Page -->
        <div class="form-card hidden" id="marksPage">

            <h1>Enter Your Details</h1>
            <p class="description">Fill in your subject marks below.</p>

            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your name">

            <div id="subjectsContainer">

                <div class="subject-row">
                    <input type="text" placeholder="Subject name">
                    <input type="number" placeholder="Marks" min="0" max="100">
                </div>

            </div>

            <button class="add-button" onclick="addSubject()">
                + Add Subject
            </button>

            <button onclick="submitMarks()">
                Continue →
            </button>

        </div>

        <!-- Result Page -->
        <div class="result-card hidden" id="resultPage">

            <h1>Academic Result</h1>
            <p class="description">Your performance summary</p>

            <h3 id="resultStudentName"></h3>

            <div id="subjectResults"></div>

            <div class="summary">
                <p>Total Marks: <strong id="totalMarks"></strong></p>
                <p>Average: <strong id="averageMarks"></strong></p>
                <p>Grade: <strong id="grade"></strong></p>
                <p>Result: <strong id="passFail"></strong></p>
            </div>
            
            <div class="download-actions">
                <button onclick="downloadPDF()">
                    Download PDF
                </button>

                <button onclick="downloadPNG()">
                    Download PNG
                </button>
            </div>

            <button onclick="location.reload()">
                Start Again
            </button>

        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
